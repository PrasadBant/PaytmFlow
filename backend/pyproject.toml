[project]
name = "paytmflow-backend"
version = "0.1.0"
description = "PaytmFlow Backend - Deterministic Financial-Journey Recovery Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "itsdangerous>=2.1.2",
    "pymupdf>=1.23.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "import-linter>=2.0",
    "aiosqlite>=0.20.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "reportlab>=5.0.1",
    "faker>=40.38.0",
    "joblib>=1.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

