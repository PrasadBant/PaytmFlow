pack: INVESTMENT
family: STALE_ACTION
description: "Verifies 409 rejection on stale snapshot ID and state preservation"
initial_goal:
  investment_mode: MONTHLY_SIP
  target_amount: 5000

steps:
  - type: action
    action_id: check_kra_status
    expected_status_code: 200
    expected_version: 2

  - type: action
    action_id: complete_risk_questionnaire
    use_stale_snapshot: true
    expected_status_code: 409
    expected_error_code: ACTION_STALE

  - type: action
    action_id: complete_risk_questionnaire
    use_stale_snapshot: false
    expected_status_code: 200
    expected_version: 3
