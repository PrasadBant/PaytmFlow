pack: INVESTMENT
family: GOLDEN
description: "Golden path for Mutual Fund SIP onboarding to READY status"
initial_goal:
  investment_mode: MONTHLY_SIP
  target_amount: 5000

steps:
  - type: action
    action_id: check_kra_status
    expected_status_code: 200
    expected_version: 2
    expected_readiness: NOT_READY
    expected_completed_count: 2

  - type: action
    action_id: complete_risk_questionnaire
    expected_status_code: 200
    expected_version: 3
    expected_readiness: NOT_READY
    expected_completed_count: 3

  - type: action
    action_id: upload_cancelled_cheque
    expected_status_code: 200
    expected_version: 4
    expected_readiness: NOT_READY
    expected_completed_count: 4

  - type: action
    action_id: register_enach_mandate
    expected_status_code: 200
    expected_version: 5
    expected_readiness: NOT_READY
    expected_completed_count: 5

  - type: action
    action_id: sign_investment_declaration
    expected_status_code: 200
    expected_version: 6
    expected_readiness: READY
    expected_completed_count: 6
