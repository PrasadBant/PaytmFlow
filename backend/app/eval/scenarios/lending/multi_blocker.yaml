pack: LENDING
family: MULTI_BLOCKER
description: "Resolves multiple parallel blockers in topological order"
initial_goal:
  loan_amount: 350000
  loan_purpose: MEDICAL_EXPENSES
  tenure_months: 36

steps:
  - type: check_recommendation
    expected_recommended_action_id:
      - UPLOAD_INCOME_PROOF
      - LINK_AA_ACCOUNT
      - SUBMIT_EMPLOYMENT_INFO

  - type: action
    action_id: SUBMIT_EMPLOYMENT_INFO
    input:
      employment_type: SALARIED
    expected_status_code: 200
    expected_version: 2
    expected_completed_count: 4

  - type: action
    action_id: VERIFY_EMPLOYER_RECORD
    input:
      employer_name: Global Tech Corp
    expected_status_code: 200
    expected_version: 3
    expected_completed_count: 5

  - type: action
    action_id: UPLOAD_INCOME_PROOF
    input:
      monthly_income: 120000
    expected_status_code: 200
    expected_version: 4
    expected_completed_count: 6

  - type: action
    action_id: ACCEPT_LOAN_TERMS
    input:
      accept_terms: true
    expected_status_code: 200
    expected_version: 5
    expected_readiness: READY
    expected_completed_count: 7
