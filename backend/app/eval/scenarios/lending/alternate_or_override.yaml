pack: LENDING
family: ALTERNATE_OR_OVERRIDE
description: "Exercises alternate action group pathways (Account Aggregator + Work ID)"
initial_goal:
  loan_amount: 150000
  loan_purpose: EDUCATION
  tenure_months: 18

steps:
  - type: action
    action_id: LINK_AA_ACCOUNT
    input:
      consent_handle: user@onemoney
    expected_status_code: 200
    expected_version: 2
    expected_completed_count: 4

  - type: action
    action_id: SUBMIT_EMPLOYMENT_INFO
    input:
      employment_type: SALARIED
    expected_status_code: 200
    expected_version: 3
    expected_completed_count: 5

  - type: action
    action_id: UPLOAD_WORK_ID
    input:
      employer_name: Fintech Solutions Ltd
    expected_status_code: 200
    expected_version: 4
    expected_completed_count: 6

  - type: action
    action_id: ACCEPT_LOAN_TERMS
    input:
      accept_terms: true
    expected_status_code: 200
    expected_version: 5
    expected_readiness: READY
    expected_completed_count: 7
