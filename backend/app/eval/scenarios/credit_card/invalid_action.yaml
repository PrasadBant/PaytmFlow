pack: CREDIT_CARD
family: INVALID_ACTION
description: "Verifies rejection of invalid actions and ensures journey integrity"
initial_goal:
  card_variant: CASHBACK
  credit_limit_preference: 100000

steps:
  - type: action
    action_id: sign_cardholder_agreement
    expected_status_code: 422
    expected_error_code: ACTION_INVALID

  - type: action
    action_id: confirm_dispatch_address
    expected_status_code: 422
    expected_error_code: ACTION_INVALID

  - type: action
    action_id: upload_salary_statement
    expected_status_code: 200
    expected_version: 2
    expected_completed_count: 2
