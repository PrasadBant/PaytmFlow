pack: CREDIT_CARD
family: STALE_ACTION
description: "Verifies 409 rejection on stale snapshot ID and state preservation"
initial_goal:
  card_variant: CASHBACK
  credit_limit_preference: 100000

steps:
  - type: action
    action_id: upload_salary_statement
    expected_status_code: 200
    expected_version: 2

  - type: action
    action_id: verify_employment_details
    use_stale_snapshot: true
    expected_status_code: 409
    expected_error_code: ACTION_STALE

  - type: action
    action_id: verify_employment_details
    use_stale_snapshot: false
    expected_status_code: 200
    expected_version: 3
