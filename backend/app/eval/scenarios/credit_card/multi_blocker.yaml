pack: CREDIT_CARD
family: MULTI_BLOCKER
description: "Resolves income, employment, and address blockers in topological order"
initial_goal:
  card_variant: REWARDS
  credit_limit_preference: 200000

steps:
  - type: check_recommendation
    expected_recommended_action_id:
      - upload_salary_statement
      - upload_it_return
      - verify_employment_details
      - verify_utility_bill

  - type: action
    action_id: verify_utility_bill
    expected_status_code: 200
    expected_version: 2
    expected_completed_count: 2

  - type: action
    action_id: confirm_dispatch_address
    expected_status_code: 200
    expected_version: 3
    expected_completed_count: 3

  - type: action
    action_id: verify_employment_details
    expected_status_code: 200
    expected_version: 4
    expected_completed_count: 4

  - type: action
    action_id: upload_salary_statement
    expected_status_code: 200
    expected_version: 5
    expected_completed_count: 5

  - type: action
    action_id: sign_cardholder_agreement
    expected_status_code: 200
    expected_version: 6
    expected_readiness: READY
    expected_completed_count: 6
