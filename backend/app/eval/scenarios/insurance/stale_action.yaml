pack: INSURANCE
family: STALE_ACTION
description: "Verifies 409 rejection on stale snapshot ID and state preservation"
initial_goal:
  sum_insured: 500000
  policy_type: INDIVIDUAL

steps:
  - type: action
    action_id: submit_medical_declaration
    expected_status_code: 200
    expected_version: 2

  - type: action
    action_id: submit_ped_records
    use_stale_snapshot: true
    expected_status_code: 409
    expected_error_code: ACTION_STALE

  - type: action
    action_id: submit_ped_records
    use_stale_snapshot: false
    expected_status_code: 200
    expected_version: 3
