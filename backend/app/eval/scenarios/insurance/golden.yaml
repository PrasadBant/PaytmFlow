pack: INSURANCE
family: GOLDEN
description: "Golden path for Health Insurance journey to READY status"
initial_goal:
  sum_insured: 500000
  policy_type: INDIVIDUAL

steps:
  - type: action
    action_id: submit_medical_declaration
    expected_status_code: 200
    expected_version: 2
    expected_readiness: NOT_READY
    expected_completed_count: 2

  - type: action
    action_id: submit_ped_records
    expected_status_code: 200
    expected_version: 3
    expected_readiness: NOT_READY
    expected_completed_count: 3

  - type: action
    action_id: setup_insurance_mandate
    expected_status_code: 200
    expected_version: 4
    expected_readiness: NOT_READY
    expected_completed_count: 4

  - type: action
    action_id: schedule_tele_mer
    expected_status_code: 200
    expected_version: 5
    expected_readiness: NOT_READY
    expected_completed_count: 5

  - type: action
    action_id: accept_insurance_policy
    expected_status_code: 200
    expected_version: 6
    expected_readiness: READY
    expected_completed_count: 6
