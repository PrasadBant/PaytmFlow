pack: ACCOUNT_OPENING
family: STALE_ACTION
description: "Verifies 409 rejection on stale snapshot ID and state preservation"
initial_goal:
  account_type: DIGITAL_SAVINGS
  initial_deposit: 5000

steps:
  - type: action
    action_id: verify_pan_for_banking
    expected_status_code: 200
    expected_version: 2

  - type: action
    action_id: declare_account_nominee
    use_stale_snapshot: true
    expected_status_code: 409
    expected_error_code: ACTION_STALE

  - type: action
    action_id: declare_account_nominee
    use_stale_snapshot: false
    expected_status_code: 200
    expected_version: 3
