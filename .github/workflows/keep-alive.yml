name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Never fail the job: a failed run makes GitHub email a failure notice
        # whenever Render is still waking up. The ping itself is what matters.
        run: curl -fsS --max-time 60 https://paytmflow-backend.onrender.com/api/v1/health || echo "Backend not ready (likely waking up); ignoring"
