openapi: 3.1.0
info:
  title: PaytmFlow API
  version: "1.0.0"
  description: >
    Canonical API contract for PaytmFlow (spec v4.2).
    FROZEN at T+3. Changes require the contract-change protocol in SHARED_CONTRACT.md §9.
    Dev2 owns this file. Dev1 generates TypeScript types from it and must never hand-edit them.

servers:
  - url: http://localhost:8000
    description: Local
  - url: /
    description: Deployed (same origin via proxy)

tags:
  - name: system
  - name: packs
  - name: journeys
  - name: evidence
  - name: demo

paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status, db, packs_loaded, ai_provider]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  db: { type: boolean }
                  packs_loaded: { type: integer }
                  packs_supported: { type: integer }
                  ai_provider: { type: string, enum: [mock, llm, local_ml] }
                  git_sha: { type: string }

  /api/v1/session:
    get:
      tags: [system]
      operationId: getSession
      description: >
        Issues an anonymous session cookie if none is present, and returns the current
        session id. Dev1 calls this once on app boot before any other request.
      responses:
        "200":
          description: Current session
          headers:
            Set-Cookie:
              schema: { type: string }
              description: pf_session=<opaque>; HttpOnly; SameSite=Lax; Secure; Path=/
          content:
            application/json:
              schema:
                type: object
                required: [session_id, created]
                properties:
                  session_id: { type: string }
                  created: { type: boolean, description: true if newly issued this request }

  /api/v1/journey-packs:
    get:
      tags: [packs]
      operationId: listJourneyPacks
      description: Drives Screen 2 (Journey Selection).
      responses:
        "200":
          description: All journey packs
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/JourneyPackSummary" }

  /api/v1/journey-packs/{journey_type}:
    get:
      tags: [packs]
      operationId: getJourneyPack
      description: >
        Returns the goal schema and display labels for one pack. Drives Screen 3
        (Goal & Basic Info), which renders its form dynamically from goal_schema.
      parameters:
        - $ref: "#/components/parameters/JourneyTypePath"
      responses:
        "200":
          description: Pack detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyPackDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/journeys:
    get:
      tags: [journeys]
      operationId: listJourneys
      description: Drives Screen 10 (My Journeys). Scoped to the caller's session.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JourneyStatus" }
        - name: journey_type
          in: query
          schema: { $ref: "#/components/schemas/JourneyType" }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Journeys for this session, newest first
          content:
            application/json:
              schema:
                type: object
                required: [journeys]
                properties:
                  journeys:
                    type: array
                    items: { $ref: "#/components/schemas/JourneyListItem" }
    post:
      tags: [journeys]
      operationId: createJourney
      description: >
        Creates a journey and its v1 snapshot. Called by Screen 3 on Continue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_type, goal]
              properties:
                journey_type: { $ref: "#/components/schemas/JourneyType" }
                goal:
                  type: object
                  additionalProperties: true
                  description: >
                    Key/value map matching the pack's goal_schema. Keys and value types are
                    validated server-side against that schema; unknown keys are rejected.
                natural_language:
                  type: string
                  maxLength: 2000
                  description: Optional secondary input, parsed by AI into the same goal map.
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyStateResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/journeys/{journey_id}:
    get:
      tags: [journeys]
      operationId: getJourney
      description: Drives Screen 4 (Current Status) and rehydration on resume.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      responses:
        "200":
          description: Current journey state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyStateResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/journeys/{journey_id}/recommendation:
    get:
      tags: [journeys]
      operationId: getRecommendation
      description: Drives Screen 5. Recomputed on every call from the current snapshot.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      responses:
        "200":
          description: One recommendation plus valid alternatives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/journeys/{journey_id}/evidence:
    post:
      tags: [evidence]
      operationId: uploadEvidence
      description: >
        Stores and interprets evidence and returns a DETERMINISTIC consequence preview.
        Creates NO snapshot. Drives Screen 6 -> Screen 7.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type, expected_snapshot_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF/JPEG/PNG, max 10 MB. Omit when using manual_fields.
                manual_fields:
                  type: string
                  description: JSON object, used by the "Enter Details" tab instead of a file.
                doc_type: { type: string, example: SALARY_SLIP }
                expected_snapshot_id: { type: string, format: uuid }
      responses:
        "200":
          description: Interpretation plus preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/StaleAction" }
        "413":
          description: File too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/journeys/{journey_id}/actions:
    post:
      tags: [journeys]
      operationId: applyAction
      description: >
        THE ONLY MUTATION ENDPOINT. Runs Deterministic Check, then atomically creates a
        snapshot, an audit event and a diff. Drives Screen 7 Continue -> Screen 8.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id, expected_snapshot_id, idempotency_key]
              properties:
                action_id: { type: string, example: UPLOAD_INCOME_PROOF }
                expected_snapshot_id: { type: string, format: uuid }
                idempotency_key: { type: string, format: uuid }
                input:
                  type: object
                  additionalProperties: true
                  description: Matches the action's input_schema; { evidence_id } for EVIDENCE actions.
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResponse" }
        "409": { $ref: "#/components/responses/StaleAction" }
        "422": { $ref: "#/components/responses/InvalidAction" }

  /api/v1/journeys/{journey_id}/clarifications:
    post:
      tags: [journeys]
      operationId: submitClarification
      description: >
        Resolves one AMBIGUOUS field. Updates ONLY the targeted field, snapshots, recomputes.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ambiguity_id, field, answer, expected_snapshot_id]
              properties:
                ambiguity_id: { type: string, example: INCOME_MISMATCH }
                field: { type: string, example: monthly_income }
                answer: {}
                expected_snapshot_id: { type: string, format: uuid }
      responses:
        "200":
          description: Clarification applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResponse" }
        "409": { $ref: "#/components/responses/StaleAction" }
        "422": { $ref: "#/components/responses/InvalidAction" }

  /api/v1/journeys/{journey_id}/diff:
    get:
      tags: [journeys]
      operationId: getDiff
      parameters:
        - { $ref: "#/components/parameters/JourneyIdPath" }
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Diff between two snapshot versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyDiff" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chat:
    post:
      tags: [journeys]
      operationId: generalChat
      description: >
        Advisory-only Q&A with NO journey context - used before any application
        exists (e.g. the goal-creation form). Never claims to know specifics about
        the caller's own application, since there isn't one yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }

  /api/v1/journeys/{journey_id}/chat:
    post:
      tags: [journeys]
      operationId: chatWithAssistant
      description: >
        Advisory-only Q&A about the caller's own journey. Grounded in the same
        server-computed journey_state/recommendation data the status/recommendation
        screens already render. Never writes state.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/review/role:
    post:
      tags: [review]
      operationId: switchPrototypeRole
      description: >
        Prototype-only: flips the CURRENT session's own role between CUSTOMER
        and REVIEW_OFFICER. This is not enterprise auth - see the Review
        Center product notes. Every /review/* endpoint still independently
        enforces the resulting role server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ReviewerRole" }
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: "#/components/schemas/ReviewerRole" }

  /api/v1/review/dashboard:
    get:
      tags: [review]
      operationId: getReviewDashboardMetrics
      description: Real, server-computed queue counts - never hard-coded.
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDashboardMetrics" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/review/cases:
    get:
      tags: [review]
      operationId: listReviewQueue
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReviewCaseStatus" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/ReviewCasePriority" } }
        - { name: journey_type, in: query, schema: { $ref: "#/components/schemas/JourneyType" } }
        - { name: mine, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueueResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/review/cases/{case_id}:
    get:
      tags: [review]
      operationId: getReviewCase
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCaseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/review/cases/{case_id}/customer-view:
    get:
      tags: [review]
      operationId: getReviewCaseCustomerView
      description: Read-only - lets a reviewer see exactly what the customer currently sees.
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      responses:
        "200":
          description: Case detail, as the customer sees their journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCaseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/review/cases/{case_id}/audit:
    get:
      tags: [review]
      operationId: getReviewCaseAudit
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      responses:
        "200":
          description: Full audit timeline for this case's journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCaseAuditResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/review/cases/{case_id}/claim:
    post:
      tags: [review]
      operationId: claimReviewCase
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_case_version]
              properties:
                expected_case_version: { type: integer }
      responses:
        "200":
          description: Case claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCase" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReviewCaseConflict" }

  /api/v1/review/cases/{case_id}/resolve:
    post:
      tags: [review]
      operationId: resolveReviewCase
      description: >
        Never approves/rejects a financial product - resolves the EVIDENCE
        exception. EVIDENCE_SUFFICIENT re-enters the exact same deterministic
        mutation chain a customer's own clarification answer uses.
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_type, resolution_reason, expected_case_version]
              properties:
                resolution_type: { $ref: "#/components/schemas/ReviewResolutionType" }
                resolution_reason: { type: string, minLength: 1 }
                resolution_notes: { type: string }
                resolution_value: {}
                expected_case_version: { type: integer }
      responses:
        "200":
          description: Case resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCaseDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReviewCaseConflict" }

  /api/v1/review/cases/{case_id}/request-information:
    post:
      tags: [review]
      operationId: requestReviewCaseInformation
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_docs, customer_message, expected_case_version]
              properties:
                requested_docs: { type: array, items: { type: string }, minItems: 1 }
                customer_message: { type: string, minLength: 1 }
                expected_case_version: { type: integer }
      responses:
        "200":
          description: Information requested; case moves to ADDITIONAL_INFO_REQUIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReviewCaseConflict" }

  /api/v1/review/cases/{case_id}/escalate:
    post:
      tags: [review]
      operationId: escalateReviewCase
      parameters: [{ $ref: "#/components/parameters/CaseIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escalation_reason, expected_case_version]
              properties:
                escalation_reason: { type: string, minLength: 1 }
                expected_case_version: { type: integer }
      responses:
        "200":
          description: Case escalated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReviewCaseConflict" }

  /api/v1/journeys/{journey_id}/review-status:
    get:
      tags: [review]
      operationId: getJourneyReviewStatus
      description: >
        Customer-facing, customer-safe phrasing only - never exposes internal
        case metadata, reviewer identity, or AI confidence numbers.
      parameters: [{ $ref: "#/components/parameters/JourneyIdPath" }]
      responses:
        "200":
          description: Review status for this journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerReviewStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      description: Wipes journey data and re-seeds packs, scenarios and the demo session.
      security:
        - demoSecret: []
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }
                  elapsed_ms: { type: integer }
        "401": { description: Bad or missing demo secret }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pf_session
    demoSecret:
      type: apiKey
      in: header
      name: X-Demo-Secret

  parameters:
    JourneyIdPath:
      name: journey_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JourneyTypePath:
      name: journey_type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/JourneyType" }
    CaseIdPath:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Not found, or not owned by this session (deliberately indistinguishable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: VALIDATION_ERROR or INVALID_JOURNEY_TYPE
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StaleAction:
      description: ACTION_STALE. No mutation occurred. Client must refetch and recompute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidAction:
      description: ACTION_INVALID. No mutation occurred.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: FORBIDDEN. The current session's role does not permit this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ReviewCaseConflict:
      description: >
        REVIEW_CASE_STALE (case_version mismatch), REVIEW_CASE_LOCKED (claimed by
        another reviewer), or REVIEW_CASE_INVALID_TRANSITION. No mutation occurred.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    JourneyType:
      type: string
      enum: [LENDING, INSURANCE, CREDIT_CARD, KYC, ACCOUNT_OPENING, INVESTMENT]

    Readiness:
      type: string
      enum: [READY, NOT_READY, NEEDS_REVIEW, DEAD_END]
      description: Deterministic enum. There is no readiness score anywhere in this API.

    JourneyStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, NEEDS_REVIEW]

    FieldStatus:
      type: string
      enum: [SATISFIED, BLOCKED, AMBIGUOUS]

    ErrorCode:
      type: string
      enum:
        - INVALID_JOURNEY_TYPE
        - VALIDATION_ERROR
        - ACTION_INVALID
        - ACTION_STALE
        - NEEDS_REVIEW
        - DEAD_END
        - AI_TIMEOUT
        - AI_MALFORMED_OUTPUT
        - EVIDENCE_CONFLICT
        - NOT_FOUND
        - FORBIDDEN
        - REVIEW_CASE_STALE
        - REVIEW_CASE_LOCKED
        - REVIEW_CASE_INVALID_TRANSITION

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: Human-readable and safe to render directly to the user.
            details:
              type: object
              additionalProperties: true
            current_snapshot_id:
              type: string
              format: uuid
              description: Present on ACTION_STALE so the client can resync without a second call.

    JourneyPackSummary:
      type: object
      required: [journey_type, display_name, description, icon, flagship_demo, lifecycle_status]
      properties:
        journey_type: { $ref: "#/components/schemas/JourneyType" }
        display_name: { type: string, example: "Loan / Lending" }
        description: { type: string, example: "Complete your loan application" }
        icon:
          type: string
          enum: [rupee, shield, card, id, bank, chart]
          description: Dev1 maps these six tokens to icon components.
        flagship_demo: { type: boolean }
        lifecycle_status: { type: string, enum: [DRAFT, VALIDATED, SUPPORTED] }

    GoalFieldSpec:
      type: object
      required: [key, type, label, required]
      properties:
        key: { type: string }
        type: { type: string, enum: [enum, money, number, text, date, boolean] }
        label: { type: string }
        required: { type: boolean }
        placeholder: { type: string }
        help_text: { type: string }
        min: { type: number }
        max: { type: number }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: {}
              label: { type: string }

    JourneyPackDetail:
      allOf:
        - $ref: "#/components/schemas/JourneyPackSummary"
        - type: object
          required: [schema_version, goal_schema, ui_labels, supports_natural_language]
          properties:
            schema_version: { type: string }
            goal_schema:
              type: array
              items: { $ref: "#/components/schemas/GoalFieldSpec" }
            supports_natural_language: { type: boolean }
            ui_labels:
              type: object
              additionalProperties: { type: string }
              description: >
                Journey-specific copy. Known keys: goal_heading, status_heading,
                status_subtext, evidence_heading, ready_heading, ready_subtext,
                recommendation_heading. Dev1 falls back to a default if a key is absent.

    FieldState:
      type: object
      required: [key, label, status]
      properties:
        key: { type: string }
        label: { type: string, example: "Income verification" }
        status: { $ref: "#/components/schemas/FieldStatus" }
        value: {}
        display_value: { type: string, description: Pre-formatted for display, e.g. "₹85,000" }
        explanation:
          type: string
          description: Why this is blocked. Rendered on the blocker card.
        resolve_action_id:
          type: string
          description: The action that resolves this field. Powers the "Resolve ->" button.
        mandatory: { type: boolean }
        ambiguity:
          type: object
          nullable: true
          properties:
            ambiguity_id: { type: string }
            reason: { type: string }
            question: { type: string }
            answer_type: { type: string, enum: [CHOICE, MONEY, NUMBER, TEXT, DATE, BOOLEAN] }
            choices:
              type: array
              items:
                type: object
                properties:
                  value: {}
                  label: { type: string }

    ProgressCounts:
      type: object
      required: [completed, pending, blockers, total]
      description: >
        Journey progress only. NOT readiness, approval, eligibility or a score.
        Dev1 renders this as "3/7 Completed". Never render it as a percentage or gauge.
      properties:
        completed: { type: integer }
        pending: { type: integer }
        blockers: { type: integer }
        total: { type: integer }

    JourneyStateResponse:
      type: object
      required: [journey_id, journey_type, schema_version, snapshot_id, version_number,
                 readiness, status, fields, progress, display]
      properties:
        journey_id: { type: string, format: uuid }
        journey_type: { $ref: "#/components/schemas/JourneyType" }
        schema_version: { type: string }
        snapshot_id: { type: string, format: uuid }
        version_number: { type: integer }
        readiness: { $ref: "#/components/schemas/Readiness" }
        status: { $ref: "#/components/schemas/JourneyStatus" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldState" }
          description: Ordered for display. Only fields with display=true and not NOT_APPLICABLE.
        progress: { $ref: "#/components/schemas/ProgressCounts" }
        pending_clarification:
          allOf: [{ $ref: "#/components/schemas/FieldState" }]
          nullable: true
          description: Present when readiness is NEEDS_REVIEW. Exactly one at a time.
        display:
          type: object
          required: [title, summary]
          properties:
            title: { type: string, example: "Personal Loan" }
            summary: { type: string, example: "₹5,00,000 · Home Renovation" }
        updated_at: { type: string, format: date-time }

    ActionOption:
      type: object
      required: [action_id, title, kind, unlocks]
      properties:
        action_id: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [EVIDENCE, FORM, CLARIFICATION]
          description: >
            Tells Dev1 which UI to open. EVIDENCE -> Screen 6.
            FORM -> generic action modal rendered from input_schema.
            CLARIFICATION -> NeedsReviewCard.
        why: { type: string }
        unlocks:
          type: array
          items: { type: string }
        accepts:
          type: array
          items: { type: string }
          description: Allowed doc_type values for EVIDENCE actions.
        input_schema:
          type: array
          items: { $ref: "#/components/schemas/GoalFieldSpec" }
          description: Field specs for FORM actions. Same renderer as the goal form.

    RecommendationResponse:
      type: object
      required: [snapshot_id, readiness, recommendation, alternatives, minimum_path_length]
      properties:
        snapshot_id: { type: string, format: uuid }
        readiness: { $ref: "#/components/schemas/Readiness" }
        recommendation:
          allOf: [{ $ref: "#/components/schemas/ActionOption" }]
          nullable: true
          description: Null when readiness is READY or DEAD_END.
        alternatives:
          type: array
          items: { $ref: "#/components/schemas/ActionOption" }
          description: Deterministically valid actions only. Safe to render as selectable.
        minimum_path_length: { type: integer }
        source:
          type: string
          enum: [AI_RANKED, PLANNER_FALLBACK]
          description: Diagnostic. Dev1 may show it in a dev-only badge, never in demo UI.

    SimulationPreview:
      type: object
      required: [newly_satisfied, newly_unlocked, predicted_readiness, progress_before, progress_after]
      description: Output of deterministic simulation. Screen 7's "Expected Outcome" renders THIS, never AI text.
      properties:
        newly_satisfied:
          type: array
          items: { type: object, properties: { key: {type: string}, label: {type: string} } }
        newly_unlocked:
          type: array
          items: { type: object, properties: { action_id: {type: string}, title: {type: string} } }
        still_blocked:
          type: array
          items: { type: object, properties: { key: {type: string}, label: {type: string} } }
        predicted_readiness: { $ref: "#/components/schemas/Readiness" }
        progress_before: { $ref: "#/components/schemas/ProgressCounts" }
        progress_after: { $ref: "#/components/schemas/ProgressCounts" }

    JourneyDiff:
      type: object
      required: [from_version, to_version, fields_changed, actions_unlocked, actions_removed, readiness, progress]
      properties:
        from_version: { type: integer }
        to_version: { type: integer }
        fields_changed:
          type: array
          items:
            type: object
            required: [key, label, from_status, to_status]
            properties:
              key: { type: string }
              label: { type: string }
              from_status: { $ref: "#/components/schemas/FieldStatus" }
              to_status: { $ref: "#/components/schemas/FieldStatus" }
              display_value: { type: string }
              cause: { type: string, example: "ACTION:UPLOAD_INCOME_PROOF" }
              cascaded: { type: boolean, description: true if changed by cascade, not directly by the action }
        actions_unlocked: { type: array, items: { type: string } }
        actions_removed: { type: array, items: { type: string } }
        readiness:
          type: object
          properties:
            from: { $ref: "#/components/schemas/Readiness" }
            to: { $ref: "#/components/schemas/Readiness" }
        progress:
          type: object
          properties:
            from: { $ref: "#/components/schemas/ProgressCounts" }
            to: { $ref: "#/components/schemas/ProgressCounts" }

    EvidenceResponse:
      type: object
      required: [evidence_id, filename, uploaded_at, interpretation, requires_review]
      properties:
        evidence_id: { type: string, format: uuid }
        filename: { type: string }
        uploaded_at: { type: string, format: date-time }
        size_bytes: { type: integer }
        interpretation:
          type: object
          required: [verified, confidence, detected, summary, conflicts]
          properties:
            verified:
              type: boolean
              description: confidence >= the pack mapping's threshold AND no conflicts.
            confidence: { type: number, minimum: 0, maximum: 1 }
            detected:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  display_value: { type: string, example: "₹85,000" }
            summary:
              type: string
              description: AI-written, plain text, never rendered as HTML.
            conflicts:
              type: array
              items:
                type: object
                properties:
                  ambiguity_id: { type: string }
                  field: { type: string }
                  message: { type: string }
        proposed_action_id: { type: string, nullable: true }
        consequence_preview:
          allOf: [{ $ref: "#/components/schemas/SimulationPreview" }]
          nullable: true
        diff_preview:
          allOf: [{ $ref: "#/components/schemas/JourneyDiff" }]
          nullable: true
        requires_review:
          type: boolean
          description: When true, Dev1 shows NeedsReviewCard instead of the Continue button.

    ActionResponse:
      type: object
      required: [journey, diff]
      properties:
        journey: { $ref: "#/components/schemas/JourneyStateResponse" }
        diff: { $ref: "#/components/schemas/JourneyDiff" }
        next_recommendation:
          allOf: [{ $ref: "#/components/schemas/RecommendationResponse" }]
          nullable: true
          description: Saves Dev1 a round trip after every action.

    JourneyListItem:
      type: object
      required: [journey_id, journey_type, display_name, icon, title, summary, status, readiness, updated_at]
      properties:
        journey_id: { type: string, format: uuid }
        journey_type: { $ref: "#/components/schemas/JourneyType" }
        display_name: { type: string }
        icon: { type: string }
        title: { type: string }
        summary: { type: string }
        status: { $ref: "#/components/schemas/JourneyStatus" }
        readiness: { $ref: "#/components/schemas/Readiness" }
        progress: { $ref: "#/components/schemas/ProgressCounts" }
        updated_at: { type: string, format: date-time }
        resume_screen:
          type: string
          enum: [STATUS, RECOMMENDATION, NEEDS_REVIEW, COMPLETE]
          description: Where Dev1 should route on resume. Server decides, client obeys.

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }

    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply: { type: string }

    ReviewerRole:
      type: string
      enum: [CUSTOMER, REVIEW_OFFICER]

    ReviewCaseStatus:
      type: string
      enum:
        - REVIEW_REQUIRED
        - UNDER_REVIEW
        - ADDITIONAL_INFO_REQUIRED
        - RESOLVED
        - ESCALATED
        - CANCELLED

    ReviewCasePriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    ReviewResolutionType:
      type: string
      enum:
        - EVIDENCE_SUFFICIENT
        - REQUEST_ADDITIONAL_INFORMATION
        - EVIDENCE_CANNOT_BE_VERIFIED
        - CUSTOMER_INFO_NEEDS_CORRECTION
        - ESCALATE_FOR_SPECIALIST_REVIEW

    ReviewEvidenceSummary:
      type: object
      required: [evidence_id, doc_type, filename, uploaded_at, verified]
      properties:
        evidence_id: { type: string, format: uuid }
        doc_type: { type: string }
        filename: { type: string }
        uploaded_at: { type: string, format: date-time }
        verified: { type: boolean }
        confidence: { type: number }
        extracted_values: { type: object, additionalProperties: true }

    ReviewCase:
      type: object
      required:
        - case_id
        - case_number
        - journey_id
        - journey_type
        - journey_display_name
        - field_key
        - reason_code
        - reason_title
        - reason_description
        - priority
        - status
        - case_version
        - created_at
        - updated_at
      properties:
        case_id: { type: string, format: uuid }
        case_number: { type: string, example: "PF-0001" }
        journey_id: { type: string, format: uuid }
        journey_type: { $ref: "#/components/schemas/JourneyType" }
        journey_display_name: { type: string }
        field_key: { type: string }
        reason_code: { type: string }
        reason_title: { type: string }
        reason_description: { type: string }
        priority: { $ref: "#/components/schemas/ReviewCasePriority" }
        status: { $ref: "#/components/schemas/ReviewCaseStatus" }
        case_version: { type: integer }
        assigned_reviewer: { type: string, nullable: true }
        is_locked: { type: boolean }
        resolution_type: { $ref: "#/components/schemas/ReviewResolutionType" }
        resolution_reason: { type: string, nullable: true }
        resolution_notes: { type: string, nullable: true }
        requested_information:
          type: object
          nullable: true
          properties:
            requested_docs: { type: array, items: { type: string } }
            customer_message: { type: string }
        escalation_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    ReviewCaseDetail:
      allOf:
        - $ref: "#/components/schemas/ReviewCase"
        - type: object
          required: [journey_context, evidence]
          properties:
            journey_context: { $ref: "#/components/schemas/JourneyStateResponse" }
            evidence:
              type: array
              items: { $ref: "#/components/schemas/ReviewEvidenceSummary" }
            impact_preview:
              $ref: "#/components/schemas/JourneyDiff"
              description: >
                Deterministic, non-persisting preview of resolving this case
                EVIDENCE_SUFFICIENT - null when no evidence-derived value
                exists yet to preview.

    ReviewQueueResponse:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          items: { $ref: "#/components/schemas/ReviewCase" }

    ReviewDashboardMetrics:
      type: object
      required: [pending_review, under_review, waiting_customer, escalated, resolved_today]
      properties:
        pending_review: { type: integer }
        under_review: { type: integer }
        waiting_customer: { type: integer }
        escalated: { type: integer }
        resolved_today: { type: integer }

    ReviewCaseAuditEntry:
      type: object
      required: [event_type, payload, created_at]
      properties:
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ReviewCaseAuditResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ReviewCaseAuditEntry" }

    CustomerReviewStatus:
      type: object
      required: [has_open_case]
      properties:
        has_open_case: { type: boolean }
        case_number: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ReviewCaseStatus" }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        requested_information:
          type: object
          nullable: true
          properties:
            requested_docs: { type: array, items: { type: string } }
            customer_message: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }

security:
  - sessionCookie: []
